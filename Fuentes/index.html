<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FridgeNFC</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FridgeNFC">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #2563eb;
      --blue-light: #eff6ff;
      --blue-dark: #1d4ed8;
      --green: #16a34a;
      --green-light: #f0fdf4;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-400: #9ca3af;
      --gray-600: #4b5563;
      --gray-800: #1f2937;
      --red: #dc2626;
      --red-light: #fef2f2;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
      --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.06);
    }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--gray-50);
      color: var(--gray-800);
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
    }

    /* ── Header ── */
    header {
      background: var(--blue);
      color: white;
      padding: 16px 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: var(--shadow-md);
    }

    header h1 { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
    header .room-badge {
      font-size: 11px;
      background: rgba(255,255,255,.2);
      border-radius: 6px;
      padding: 3px 8px;
      font-weight: 600;
      letter-spacing: .5px;
      cursor: pointer;
    }

    /* ── Onboarding overlay ── */
    #onboarding {
      position: fixed; inset: 0; background: rgba(0,0,0,.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; padding: 24px;
    }
    #onboarding .card {
      background: white; border-radius: 20px; padding: 32px 24px;
      text-align: center; max-width: 360px; width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    #onboarding h2 { font-size: 22px; margin-bottom: 8px; }
    #onboarding p { color: var(--gray-600); font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
    #onboarding .url-box {
      background: var(--blue-light); border: 1.5px solid var(--blue);
      border-radius: 10px; padding: 12px 16px; font-size: 13px;
      font-family: monospace; word-break: break-all; color: var(--blue-dark);
      margin-bottom: 16px;
    }
    #onboarding .btn-copy {
      width: 100%; padding: 14px; background: var(--blue); color: white;
      border: none; border-radius: 10px; font-size: 15px; font-weight: 600;
      cursor: pointer; margin-bottom: 10px;
    }
    #onboarding .btn-copy:active { background: var(--blue-dark); }
    #onboarding .btn-skip {
      background: none; border: none; color: var(--gray-400);
      font-size: 13px; cursor: pointer; padding: 4px;
    }

    /* ── Person selector ── */
    #person-bar {
      background: white; border-bottom: 1px solid var(--gray-200);
      padding: 10px 16px; display: flex; gap: 8px; overflow-x: auto;
      scrollbar-width: none;
    }
    #person-bar::-webkit-scrollbar { display: none; }

    .person-chip {
      flex-shrink: 0; padding: 6px 14px; border-radius: 20px;
      border: 1.5px solid var(--gray-200); background: white;
      font-size: 13px; font-weight: 500; cursor: pointer;
      transition: all .15s; color: var(--gray-600);
    }
    .person-chip.active {
      background: var(--blue); border-color: var(--blue); color: white;
    }

    /* ── Tabs ── */
    #tabs {
      display: flex; background: white; border-bottom: 1px solid var(--gray-200);
    }
    .tab {
      flex: 1; padding: 12px 8px; text-align: center; font-size: 13px;
      font-weight: 600; color: var(--gray-400); cursor: pointer;
      border-bottom: 2.5px solid transparent; transition: all .15s;
    }
    .tab.active { color: var(--blue); border-color: var(--blue); }

    /* ── List ── */
    #list-container { flex: 1; overflow-y: auto; padding: 12px 16px 100px; }

    .section-label {
      font-size: 11px; font-weight: 700; letter-spacing: .8px;
      color: var(--gray-400); text-transform: uppercase;
      padding: 8px 4px 6px; margin-top: 4px;
    }

    .item-row {
      display: flex; align-items: center; gap: 12px;
      background: white; border-radius: var(--radius); padding: 14px 16px;
      margin-bottom: 8px; box-shadow: var(--shadow);
      animation: slideIn .2s ease;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } }

    .item-row.done { opacity: .55; }
    .item-row.done .item-name { text-decoration: line-through; }

    .item-check {
      width: 22px; height: 22px; border-radius: 6px;
      border: 2px solid var(--gray-200); background: white;
      cursor: pointer; flex-shrink: 0; display: flex;
      align-items: center; justify-content: center; transition: all .15s;
    }
    .item-check.checked { background: var(--green); border-color: var(--green); }
    .item-check.checked::after { content: '✓'; color: white; font-size: 13px; font-weight: 700; }

    .item-body { flex: 1; min-width: 0; }
    .item-name { font-size: 15px; font-weight: 500; }
    .item-meta { font-size: 11px; color: var(--gray-400); margin-top: 2px; }

    .item-delete {
      background: none; border: none; color: var(--gray-400);
      font-size: 18px; cursor: pointer; padding: 4px; line-height: 1;
      flex-shrink: 0;
    }
    .item-delete:hover { color: var(--red); }

    .empty-state {
      text-align: center; padding: 48px 24px; color: var(--gray-400);
    }
    .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    /* ── FAB ── */
    #fab {
      position: fixed; bottom: 24px; right: 50%;
      transform: translateX(50%);
      background: var(--blue); color: white; border: none;
      border-radius: 28px; padding: 16px 32px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 20px rgba(37,99,235,.45);
      display: flex; align-items: center; gap: 8px;
      transition: transform .15s, box-shadow .15s;
      z-index: 20;
    }
    #fab:active { transform: translateX(50%) scale(.96); box-shadow: 0 2px 10px rgba(37,99,235,.35); }

    /* ── Add modal ── */
    #modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.4);
      z-index: 50; display: flex; align-items: flex-end; justify-content: center;
      padding: 0 0 env(safe-area-inset-bottom);
    }
    #modal {
      background: white; border-radius: 20px 20px 0 0;
      padding: 24px 24px 32px; width: 100%; max-width: 480px;
      box-shadow: 0 -8px 32px rgba(0,0,0,.15);
      animation: slideUp .25s cubic-bezier(.4,0,.2,1);
    }
    @keyframes slideUp { from { transform: translateY(100%); } }

    #modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }

    .modal-persons {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
    }
    .modal-person {
      padding: 7px 14px; border-radius: 20px;
      border: 1.5px solid var(--gray-200); font-size: 13px; font-weight: 500;
      cursor: pointer; color: var(--gray-600); background: white;
    }
    .modal-person.selected { background: var(--blue); border-color: var(--blue); color: white; }

    .modal-input {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--gray-200);
      border-radius: 10px; font-size: 15px; outline: none;
      margin-bottom: 16px;
    }
    .modal-input:focus { border-color: var(--blue); }

    .modal-actions { display: flex; gap: 10px; }
    .btn-cancel {
      flex: 1; padding: 14px; background: var(--gray-100); border: none;
      border-radius: 10px; font-size: 15px; font-weight: 600;
      color: var(--gray-600); cursor: pointer;
    }
    .btn-add {
      flex: 2; padding: 14px; background: var(--blue); border: none;
      border-radius: 10px; font-size: 15px; font-weight: 600;
      color: white; cursor: pointer;
    }
    .btn-add:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Clear done button ── */
    #clear-done {
      display: block; margin: 12px auto 0; padding: 10px 20px;
      background: var(--red-light); border: 1px solid var(--red);
      color: var(--red); border-radius: 8px; font-size: 13px;
      font-weight: 600; cursor: pointer;
    }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: var(--gray-800); color: white; padding: 10px 20px;
      border-radius: 20px; font-size: 13px; font-weight: 500;
      opacity: 0; transition: opacity .2s; z-index: 200; pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- Onboarding -->
<div id="onboarding" class="hidden">
  <div class="card">
    <div style="font-size:48px;margin-bottom:12px">🧊</div>
    <h2>Tu nevera está lista</h2>
    <p>Guarda este enlace único. Ponlo en el sticker NFC o compártelo con tu familia.</p>
    <div class="url-box" id="onboarding-url"></div>
    <button class="btn-copy" id="btn-copy-url">Copiar enlace</button>
    <button class="btn-skip" id="btn-skip">Entrar sin guardar</button>
  </div>
</div>

<!-- Header -->
<header>
  <h1>🧊 FridgeNFC</h1>
  <span class="room-badge" id="room-badge" title="Tu ID de nevera"></span>
</header>

<!-- Person filter bar -->
<div id="person-bar"></div>

<!-- Tabs -->
<div id="tabs">
  <div class="tab active" data-tab="pending">Falta 🛒</div>
  <div class="tab" data-tab="done">Comprado ✅</div>
</div>

<!-- List -->
<div id="list-container">
  <div class="empty-state" id="empty-state">
    <div class="emoji">🛒</div>
    <p>Todo en orden.<br>Pulsa + para añadir algo.</p>
  </div>
</div>

<!-- Add FAB -->
<button id="fab">+ Añadir</button>

<!-- Add modal -->
<div id="modal-overlay" class="hidden">
  <div id="modal">
    <h3>¿Quién añade?</h3>
    <div class="modal-persons" id="modal-persons"></div>
    <input class="modal-input" id="modal-input" type="text" placeholder="¿Qué falta?" maxlength="60" autocomplete="off">
    <div class="modal-actions">
      <button class="btn-cancel" id="btn-cancel">Cancelar</button>
      <button class="btn-add" id="btn-add" disabled>Añadir</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
  // ── Config ──────────────────────────────────────────────────────────────
  const SUPABASE_URL = 'YOUR_SUPABASE_URL';
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

  const PERSONS = ['Aitor', 'Miren', 'Ama', 'Aita', 'Amuma', 'Aitite'];
  const MAX_PERSONS = 6;

  // ── State ──────────────────────────────────────────────────────────────
  let roomId = null;
  let items = [];
  let activeTab = 'pending';
  let filterPerson = null;
  let addPerson = null;
  let isOnline = navigator.onLine;

  // ── Room ID ────────────────────────────────────────────────────────────
  function getOrCreateRoomId() {
    // Check URL hash first (shared link / NFC sticker)
    const hash = location.hash.replace('#', '').trim();
    if (hash && /^[a-z0-9]{8,}$/.test(hash)) {
      localStorage.setItem('fridgenfc_room', hash);
      return hash;
    }
    let stored = localStorage.getItem('fridgenfc_room');
    if (!stored) {
      stored = crypto.randomUUID().replace(/-/g, '').slice(0, 12);
      localStorage.setItem('fridgenfc_room', stored);
      return stored; // signal: first time
    }
    return stored;
  }

  function isFirstVisit() {
    return !localStorage.getItem('fridgenfc_welcomed');
  }

  // ── Supabase helpers ───────────────────────────────────────────────────
  async function sbFetch(path, opts = {}) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': opts.prefer || 'return=representation',
        ...opts.headers,
      },
      ...opts,
    });
    if (!res.ok) throw new Error(await res.text());
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }

  async function fetchItems() {
    try {
      const data = await sbFetch(
        `items?room_id=eq.${roomId}&order=created_at.asc`,
        { method: 'GET' }
      );
      items = data || [];
    } catch (e) {
      // Offline: use cached items
      console.warn('Offline, using cache:', e);
    }
    render();
  }

  async function addItem(name, person) {
    const optimistic = {
      id: 'tmp_' + Date.now(),
      room_id: roomId,
      name,
      done: false,
      added_by: person,
      created_at: new Date().toISOString(),
    };
    items.unshift(optimistic);
    render();

    try {
      const [created] = await sbFetch('items', {
        method: 'POST',
        body: JSON.stringify({ room_id: roomId, name, done: false, added_by: person }),
      });
      items = items.map(i => i.id === optimistic.id ? created : i);
    } catch (e) {
      toast('Sin conexión — se guardará cuando vuelva el internet');
    }
    render();
  }

  async function toggleItem(id) {
    const item = items.find(i => i.id === id);
    if (!item) return;
    item.done = !item.done;
    render();
    try {
      await sbFetch(`items?id=eq.${id}`, {
        method: 'PATCH',
        body: JSON.stringify({ done: item.done }),
        prefer: 'return=minimal',
      });
    } catch (e) {
      item.done = !item.done; // revert
      render();
      toast('Error al guardar');
    }
  }

  async function deleteItem(id) {
    items = items.filter(i => i.id !== id);
    render();
    try {
      await sbFetch(`items?id=eq.${id}`, {
        method: 'DELETE',
        prefer: 'return=minimal',
      });
    } catch (e) {
      toast('Error al borrar');
    }
  }

  async function clearDone() {
    const doneIds = items.filter(i => i.done).map(i => i.id);
    if (!doneIds.length) return;
    items = items.filter(i => !i.done);
    render();
    try {
      await sbFetch(`items?room_id=eq.${roomId}&done=eq.true`, {
        method: 'DELETE',
        prefer: 'return=minimal',
      });
    } catch (e) {
      toast('Error al limpiar');
    }
  }

  // ── Render ─────────────────────────────────────────────────────────────
  function render() {
    renderPersonBar();
    renderList();
  }

  function renderPersonBar() {
    const bar = document.getElementById('person-bar');
    bar.innerHTML = '';

    const all = document.createElement('button');
    all.className = 'person-chip' + (filterPerson === null ? ' active' : '');
    all.textContent = 'Todos';
    all.onclick = () => { filterPerson = null; render(); };
    bar.appendChild(all);

    const presentPersons = [...new Set(items.map(i => i.added_by))].filter(Boolean);
    presentPersons.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'person-chip' + (filterPerson === p ? ' active' : '');
      btn.textContent = p;
      btn.onclick = () => { filterPerson = p; render(); };
      bar.appendChild(btn);
    });
  }

  function renderList() {
    const container = document.getElementById('list-container');
    const empty = document.getElementById('empty-state');
    container.innerHTML = '';
    container.appendChild(empty);

    let filtered = filterPerson
      ? items.filter(i => i.added_by === filterPerson)
      : items;

    const pending = filtered.filter(i => !i.done);
    const done = filtered.filter(i => i.done);

    const showing = activeTab === 'pending' ? pending : done;

    if (showing.length === 0) {
      empty.classList.remove('hidden');
      empty.querySelector('.emoji').textContent = activeTab === 'pending' ? '🛒' : '✅';
      empty.querySelector('p').innerHTML = activeTab === 'pending'
        ? 'Todo en orden.<br>Pulsa + para añadir algo.'
        : 'Nada comprado todavía.';
      return;
    }
    empty.classList.add('hidden');

    showing.forEach(item => {
      const row = document.createElement('div');
      row.className = 'item-row' + (item.done ? ' done' : '');

      const check = document.createElement('button');
      check.className = 'item-check' + (item.done ? ' checked' : '');
      check.setAttribute('aria-label', item.done ? 'Marcar pendiente' : 'Marcar comprado');
      check.onclick = () => toggleItem(item.id);

      const body = document.createElement('div');
      body.className = 'item-body';
      body.innerHTML = `
        <div class="item-name">${escHtml(item.name)}</div>
        ${item.added_by ? `<div class="item-meta">Añadido por ${escHtml(item.added_by)}</div>` : ''}
      `;

      const del = document.createElement('button');
      del.className = 'item-delete';
      del.innerHTML = '×';
      del.setAttribute('aria-label', 'Eliminar');
      del.onclick = () => deleteItem(item.id);

      row.appendChild(check);
      row.appendChild(body);
      row.appendChild(del);
      container.appendChild(row);
    });

    if (activeTab === 'done' && done.length > 0) {
      const clearBtn = document.createElement('button');
      clearBtn.id = 'clear-done';
      clearBtn.textContent = `Limpiar comprados (${done.length})`;
      clearBtn.onclick = clearDone;
      container.appendChild(clearBtn);
    }
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Modal ──────────────────────────────────────────────────────────────
  function openModal() {
    addPerson = null;
    document.getElementById('modal-input').value = '';
    document.getElementById('btn-add').disabled = true;
    renderModalPersons();
    document.getElementById('modal-overlay').classList.remove('hidden');
    setTimeout(() => document.getElementById('modal-input').focus(), 50);
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.add('hidden');
  }

  function renderModalPersons() {
    const container = document.getElementById('modal-persons');
    container.innerHTML = '';
    PERSONS.slice(0, MAX_PERSONS).forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'modal-person' + (addPerson === p ? ' selected' : '');
      btn.textContent = p;
      btn.onclick = () => {
        addPerson = p;
        renderModalPersons();
        checkAddReady();
      };
      container.appendChild(btn);
    });
  }

  function checkAddReady() {
    const val = document.getElementById('modal-input').value.trim();
    document.getElementById('btn-add').disabled = !(val && addPerson);
  }

  // ── Toast ──────────────────────────────────────────────────────────────
  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
  }

  // ── Onboarding ─────────────────────────────────────────────────────────
  function showOnboarding() {
    const url = location.origin + location.pathname + '#' + roomId;
    document.getElementById('onboarding-url').textContent = url;
    document.getElementById('onboarding').classList.remove('hidden');

    document.getElementById('btn-copy-url').onclick = () => {
      navigator.clipboard.writeText(url).then(() => {
        document.getElementById('btn-copy-url').textContent = '¡Copiado!';
        setTimeout(dismissOnboarding, 1200);
      });
    };
    document.getElementById('btn-skip').onclick = dismissOnboarding;
  }

  function dismissOnboarding() {
    localStorage.setItem('fridgenfc_welcomed', '1');
    document.getElementById('onboarding').classList.add('hidden');
  }

  // ── Boot ───────────────────────────────────────────────────────────────
  function init() {
    const isNew = isFirstVisit();
    roomId = getOrCreateRoomId();

    // Update URL hash silently
    history.replaceState(null, '', '#' + roomId);

    // Badge
    document.getElementById('room-badge').textContent = roomId.slice(0, 6).toUpperCase();
    document.getElementById('room-badge').title = `ID: ${roomId} — clic para copiar URL`;
    document.getElementById('room-badge').onclick = () => {
      navigator.clipboard.writeText(location.href).then(() => toast('Enlace copiado'));
    };

    if (isNew || !localStorage.getItem('fridgenfc_welcomed')) {
      showOnboarding();
    }

    // Tabs
    document.querySelectorAll('.tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeTab = tab.dataset.tab;
        render();
      };
    });

    // FAB
    document.getElementById('fab').onclick = openModal;

    // Modal
    document.getElementById('modal-input').oninput = checkAddReady;
    document.getElementById('modal-input').onkeydown = e => {
      if (e.key === 'Enter' && !document.getElementById('btn-add').disabled) {
        document.getElementById('btn-add').click();
      }
    };
    document.getElementById('btn-cancel').onclick = closeModal;
    document.getElementById('modal-overlay').onclick = e => {
      if (e.target === document.getElementById('modal-overlay')) closeModal();
    };
    document.getElementById('btn-add').onclick = async () => {
      const name = document.getElementById('modal-input').value.trim();
      if (!name || !addPerson) return;
      closeModal();
      await addItem(name, addPerson);
    };

    // Online/offline
    window.addEventListener('online', () => { isOnline = true; fetchItems(); toast('Conexión restaurada'); });
    window.addEventListener('offline', () => { isOnline = false; toast('Sin conexión'); });

    // Poll every 30s for updates
    fetchItems();
    setInterval(fetchItems, 30000);
  }

  // ── Service Worker ─────────────────────────────────────────────────────
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/service-worker.js').catch(console.warn);
  }

  init();
</script>
</body>
</html>
